<style>
/* Concepto: se activa al acostarse y escucha toda la noche. Cuando reconoce ronquidos (sonidos graves que se repiten
   al ritmo de la respiración) los cuenta minuto a minuto y graba un trozo de cada episodio. En la mañana muestra
   cuánto se roncó, un gráfico por hora, las grabaciones y el historial de todas las noches. Todo queda en el iPhone. */
/*DS:TOKENS:START*/
/* ── Domésticas · sistema de diseño común (v1) ──────────────────────────────
   Paleta: #2950F4 · #4D78F3 · #719DF6 · #99C2F8 · #BDEBFB, con el azul marino #182D4A de fondo oscuro.
   Estilo iOS 27: tipografía del sistema (SF Pro), tarjetas blancas sobre fondo agrupado,
   barras y botones de vidrio, cápsulas, esquinas amplias. Igual en todas las apps de la casa. */
:root {
  --ds-b1: #2950F4; --ds-b2: #4D78F3; --ds-b3: #719DF6; --ds-b4: #99C2F8; --ds-b5: #BDEBFB; --ds-navy: #182D4A;
  --ds-font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro", system-ui, "Helvetica Neue", Arial, sans-serif;
  --ds-font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --ds-font-mono: ui-monospace, "SF Mono", Menlo, monospace;
  --ds-r-card: 24px; --ds-r-inner: 16px; --ds-r-field: 14px; --ds-r-sheet: 34px; --ds-r-pill: 999px;

  --ds-bg: #EFF3FB;
  --ds-bg-top: #DFE9FD;
  --ds-surface: #FFFFFF;
  --ds-surface-2: #F3F6FD;
  --ds-fill: rgba(41, 80, 244, 0.07);
  --ds-fill-2: rgba(41, 80, 244, 0.13);
  --ds-ink: #0E1B33;
  --ds-ink-2: #55617A;
  --ds-ink-3: #8691A8;
  --ds-line: rgba(24, 45, 74, 0.12);
  --ds-line-2: rgba(24, 45, 74, 0.2);
  --ds-tint: #2950F4;
  --ds-tint-soft: #E5ECFE;
  --ds-btn: #2950F4;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #157A43; --ds-pos-soft: #DDF4E6;
  --ds-neg: #D1281C; --ds-neg-soft: #FDE8E6;
  --ds-warn: #A35500; --ds-warn-soft: #FFF0D9;
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.45) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #4D78F3 0%, #2950F4 58%, #2141D6 100%);
  --ds-hero-ink: #FFFFFF;
  --ds-hero-ink-2: rgba(255, 255, 255, 0.84);
  --ds-hero-line: rgba(255, 255, 255, 0.28);
  --ds-hero-glass: rgba(255, 255, 255, 0.18);
  --ds-glass: rgba(255, 255, 255, 0.7);
  --ds-glass-strong: rgba(255, 255, 255, 0.86);
  --ds-glass-line: rgba(255, 255, 255, 0.85);
  --ds-glass-edge: rgba(14, 27, 51, 0.1);
  --ds-glass-blur: blur(22px) saturate(1.8);
  --ds-shadow-1: 0 1px 2px rgba(24, 45, 74, 0.05), 0 4px 14px rgba(24, 45, 74, 0.05);
  --ds-shadow-2: 0 12px 32px rgba(24, 45, 74, 0.16), 0 2px 8px rgba(24, 45, 74, 0.08);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.32), 0 6px 16px rgba(41, 80, 244, 0.26);
  --ds-scrim: rgba(14, 27, 51, 0.36);
  --ds-chart-1: #2950F4; --ds-chart-2: #719DF6; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ds-bg: #0A1224;
    --ds-bg-top: #13244A;
    --ds-surface: #152340;
    --ds-surface-2: #1C2C4D;
    --ds-fill: rgba(113, 157, 246, 0.12);
    --ds-fill-2: rgba(113, 157, 246, 0.2);
    --ds-ink: #EEF3FF;
    --ds-ink-2: #A9B6D0;
    --ds-ink-3: #77859F;
    --ds-line: rgba(189, 235, 251, 0.11);
    --ds-line-2: rgba(189, 235, 251, 0.2);
    --ds-tint: #8EB0FA;
    --ds-tint-soft: rgba(113, 157, 246, 0.18);
    --ds-btn: #3A62F5;
    --ds-on-btn: #FFFFFF;
    --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
    --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
    --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
    --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
    --ds-glass: rgba(24, 40, 70, 0.62);
    --ds-glass-strong: rgba(24, 40, 70, 0.84);
    --ds-glass-line: rgba(255, 255, 255, 0.14);
    --ds-glass-edge: rgba(0, 0, 0, 0.4);
    --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
    --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
    --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
    --ds-scrim: rgba(0, 0, 0, 0.55);
    --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ds-bg: #0A1224;
  --ds-bg-top: #13244A;
  --ds-surface: #152340;
  --ds-surface-2: #1C2C4D;
  --ds-fill: rgba(113, 157, 246, 0.12);
  --ds-fill-2: rgba(113, 157, 246, 0.2);
  --ds-ink: #EEF3FF;
  --ds-ink-2: #A9B6D0;
  --ds-ink-3: #77859F;
  --ds-line: rgba(189, 235, 251, 0.11);
  --ds-line-2: rgba(189, 235, 251, 0.2);
  --ds-tint: #8EB0FA;
  --ds-tint-soft: rgba(113, 157, 246, 0.18);
  --ds-btn: #3A62F5;
  --ds-on-btn: #FFFFFF;
  --ds-pos: #5DD68E; --ds-pos-soft: rgba(93, 214, 142, 0.14);
  --ds-neg: #FF8A80; --ds-neg-soft: rgba(255, 138, 128, 0.14);
  --ds-warn: #FFB65C; --ds-warn-soft: rgba(255, 182, 92, 0.14);
  --ds-hero: radial-gradient(120% 90% at 100% 0%, rgba(189, 235, 251, 0.28) 0%, rgba(189, 235, 251, 0) 55%), linear-gradient(150deg, #3D68F2 0%, #2950F4 55%, #1C38C2 100%);
  --ds-glass: rgba(24, 40, 70, 0.62);
  --ds-glass-strong: rgba(24, 40, 70, 0.84);
  --ds-glass-line: rgba(255, 255, 255, 0.14);
  --ds-glass-edge: rgba(0, 0, 0, 0.4);
  --ds-shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --ds-shadow-2: 0 14px 36px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --ds-shadow-btn: inset 0 1px 0 rgba(255, 255, 255, 0.22), 0 6px 16px rgba(0, 0, 0, 0.35);
  --ds-scrim: rgba(0, 0, 0, 0.55);
  --ds-chart-1: #719DF6; --ds-chart-2: #4D78F3; --ds-chart-3: #99C2F8; --ds-chart-4: #BDEBFB;
  color-scheme: dark;
}
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 340px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.012em;
}
/* ── fin de los tokens comunes ── */

/* Variables propias de Ronquidos */
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --chart: #2950F4;           /* serie de los gráficos (validada contra la tarjeta) */
  --seg-on: #FFFFFF;
  /* Pantalla de la noche: negro puro y azul tenue para no encandilar */
  --nt-1: #7F98D4; --nt-2: #4D649A; --nt-3: #2A3A60; --nt-rec: #B5655B;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --chart: #6690F5; --seg-on: #31477A; }
}
:root[data-theme="dark"] { --chart: #6690F5; --seg-on: #31477A; }
/*DS:TOKENS:END*/

/*DS:LAYER:START*/
/* ── Domésticas · base común (v1) ── */
html { background: var(--ds-bg); }
body {
  font-family: var(--ds-font);
  background: linear-gradient(180deg, var(--ds-bg-top) 0, var(--ds-bg) 360px) no-repeat, var(--ds-bg);
  color: var(--ds-ink);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
h1, h2, h3, h4 { font-family: var(--ds-font-display); letter-spacing: -0.022em; }
button, input, select, textarea { font-family: inherit; }
::selection { background: var(--ds-tint-soft); }
:focus-visible { outline-color: var(--ds-tint); }
input, select, textarea { accent-color: var(--ds-btn); caret-color: var(--ds-tint); }
@keyframes ds-rise { from { transform: translateY(28px); opacity: 0; } to { transform: none; opacity: 1; } }
.mark.app-icon, img.app-icon { display: block; overflow: hidden; padding: 0; background: none; object-fit: cover; border-radius: 23%; box-shadow: 0 0 0 0.5px rgba(14, 27, 51, 0.08), 0 4px 12px rgba(41, 80, 244, 0.25); }
/* ── fin de la base común ── */

/* ── Ronquidos ── */
*, *::before, *::after { box-sizing: border-box; }
html.lock { overflow: hidden; }
[hidden] { display: none !important; }
body { margin: 0; padding-inline: 16px; font-size: 17px; line-height: 1.38; letter-spacing: -0.012em; -webkit-text-size-adjust: 100%; }
/* Sin zoom: ni con dos dedos ni con doble toque (Safari ignora user-scalable; el bloqueo real está en el script) */
html, body { touch-action: pan-x pan-y; }
button, a, input, label, .row, .seg, .sw { touch-action: manipulation; }
.app { max-width: 480px; margin: 0 auto; padding-block: 14px 48px; display: flex; flex-direction: column; gap: 22px; }
button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
svg { display: block; flex: none; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 600; color: var(--ds-ink-2); letter-spacing: -0.005em; }
:focus-visible { outline: 3px solid var(--ds-tint); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ico.fill { fill: currentColor; stroke: none; }

/* Encabezado: icono + fecha + título grande, y el botón de ajustes */
.top { display: flex; align-items: center; gap: 12px; padding-top: 6px; }
.top .app-icon { width: 46px; height: 46px; flex: none; }
.top-txt { flex: 1; min-width: 0; }
.top h1 { font-size: clamp(27px, 8.6vw, 34px); line-height: 1.08; font-weight: 700; letter-spacing: -0.03em; }
.round-btn {
  width: 44px; height: 44px; flex: none; display: grid; place-items: center; padding: 0; border: 0.5px solid var(--ds-glass-line); border-radius: 50%;
  background: var(--ds-glass); color: var(--ds-tint); box-shadow: var(--ds-shadow-1), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  -webkit-backdrop-filter: var(--ds-glass-blur); backdrop-filter: var(--ds-glass-blur); transition: transform 0.16s ease;
}
.round-btn:active { transform: scale(0.94); }

/* Botones en cápsula */
.btn {
  min-height: 50px; padding: 0 20px; border: 0; border-radius: var(--ds-r-pill);
  font-size: 17px; font-weight: 600; letter-spacing: -0.01em;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform 0.16s ease, opacity 0.16s ease, background-color 0.16s ease;
}
.btn:active { transform: scale(0.97); opacity: 0.88; }
.btn.primary { background: var(--ds-btn); color: var(--ds-on-btn); box-shadow: var(--ds-shadow-btn); }
.btn.tonal { background: var(--ds-tint-soft); color: var(--ds-tint); }
.btn.ghost { background: var(--ds-surface); color: var(--ds-tint); box-shadow: var(--ds-shadow-1); }
.btn.danger { background: var(--ds-neg-soft); color: var(--ds-neg); }
.btn.danger.armed { background: var(--ds-neg); color: #fff; }
.btn.small { min-height: 38px; padding: 0 16px; font-size: 15px; }
.btn.block { width: 100%; }
.btn.big { min-height: 58px; font-size: 18px; }
.btn .ico { width: 21px; height: 21px; }

/* Tarjeta principal: la última noche */
.hero {
  position: relative; overflow: hidden; isolation: isolate;
  border-radius: 28px; padding: 18px 20px 20px; background: var(--ds-hero); color: var(--ds-hero-ink);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.38), inset 0 -1px 0 rgba(14, 27, 51, 0.16), 0 16px 34px rgba(41, 80, 244, 0.26);
}
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0) 38%); }
.hero-art { position: absolute; right: -22px; bottom: -34px; z-index: -1; width: 168px; height: 168px; opacity: 0.13; color: #fff; }
.hero .eyebrow { font-size: 15px; color: var(--ds-hero-ink-2); }
.count-big { margin-top: 6px; font-family: var(--ds-font-round); font-weight: 700; font-size: 52px; line-height: 1; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.count-big span { margin-left: 8px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; color: var(--ds-hero-ink-2); }
.count-big.ok { font-size: 38px; }
.hero-sub { margin: 8px 0 0; font-size: 16px; color: var(--ds-hero-ink-2); }
.hero-title { margin: 6px 0 0; font-family: var(--ds-font-display); font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.03em; }
.hero-txt { margin: 10px 0 0; font-size: 16px; line-height: 1.4; color: var(--ds-hero-ink-2); max-width: 34em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chips span { display: inline-flex; align-items: center; gap: 5px; min-height: 32px; padding: 0 12px; border-radius: var(--ds-r-pill);
  background: var(--ds-hero-glass); border: 0.5px solid var(--ds-hero-line); font-size: 14px; color: var(--ds-hero-ink-2); }
.chips b { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
.hero-cta { margin-top: 16px; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; padding: 0 14px 0 18px; border: 0; border-radius: var(--ds-r-pill); background: #fff; color: var(--ds-b1); font-size: 16px; font-weight: 700; box-shadow: 0 6px 16px rgba(14, 27, 51, 0.2); }
.hero-cta:active { transform: scale(0.97); }
.hero-cta .ico { width: 18px; height: 18px; stroke-width: 2.4; }

.start { display: flex; flex-direction: column; gap: 8px; margin-top: -4px; }
.start .hint { text-align: center; }

/* Títulos de sección */
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 6px; min-height: 34px; }
.sec-head h2 { font-size: 22px; font-weight: 700; line-height: 1.2; letter-spacing: -0.025em; }
.sec-note { flex: none; font-size: 13px; font-weight: 600; color: var(--ds-ink-2); }
.card { background: var(--ds-surface); border-radius: var(--ds-r-card); box-shadow: var(--ds-shadow-1); padding: 14px 14px 12px; }
.card-cap { margin: 2px 4px 10px; font-size: 13px; font-weight: 600; color: var(--ds-ink-2); }

/* Control segmentado en cápsula */
.seg { display: flex; flex: none; padding: 3px; gap: 2px; border-radius: var(--ds-r-pill); background: var(--ds-fill-2); }
.seg button { flex: 1; min-height: 30px; padding: 0 12px; border: 0; border-radius: var(--ds-r-pill); background: transparent; color: var(--ds-ink-2); font-size: 14px; font-weight: 600; white-space: nowrap; transition: background-color 0.16s ease, color 0.16s ease; }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--ds-ink); box-shadow: 0 1px 3px rgba(14, 27, 51, 0.14), 0 0 0 0.5px rgba(14, 27, 51, 0.04); }
.seg.wide { width: 100%; }
.seg.wide button { min-height: 34px; }

/* Gráficos de barras */
.chart { position: relative; touch-action: pan-y; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.chart svg { width: 100%; height: auto; overflow: visible; }
.chart .grid line { stroke: var(--ds-line); stroke-width: 1; }
.chart .grid line.base { stroke: var(--ds-line-2); }
.chart text { font-family: var(--ds-font); font-size: 11px; fill: var(--ds-ink-3); font-variant-numeric: tabular-nums; }
.chart .bar { fill: var(--chart); transition: opacity 0.15s ease; }
.chart.active .bar { opacity: 0.38; }
.chart.active .bar.on { opacity: 1; }
.chart .guide { stroke: var(--ds-ink-3); stroke-width: 1; stroke-dasharray: 2 3; opacity: 0; }
.chart.active .guide { opacity: 0.7; }
.chart-empty { position: absolute; left: 30px; right: 0; top: 34%; text-align: center; font-size: 15px; font-weight: 600; color: var(--ds-ink-2); pointer-events: none; }
.tip {
  position: absolute; left: 0; top: 0; z-index: 2; min-width: 84px; padding: 6px 11px 7px; border-radius: 14px; text-align: center; white-space: nowrap; pointer-events: none;
  background: var(--ds-glass-strong); border: 0.5px solid var(--ds-glass-line); box-shadow: var(--ds-shadow-2);
  -webkit-backdrop-filter: var(--ds-glass-blur); backdrop-filter: var(--ds-glass-blur);
  font-size: 12px; line-height: 1.25; color: var(--ds-ink-2);
}
.tip b { display: block; font-size: 15px; font-weight: 700; color: var(--ds-ink); font-variant-numeric: tabular-nums; }

/* Cifras de resumen */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
.stat { min-width: 0; padding: 10px 12px; border-radius: var(--ds-r-inner); background: var(--ds-surface-2); }
.stat small { display: block; font-size: 12px; font-weight: 600; color: var(--ds-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b { display: block; margin-top: 2px; font-family: var(--ds-font-round); font-size: 21px; font-weight: 700; line-height: 1.15; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat b span { font-family: var(--ds-font); font-size: 13px; font-weight: 600; letter-spacing: 0; color: var(--ds-ink-2); }
.stat em { display: block; font-style: normal; font-size: 12px; color: var(--ds-ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Listas agrupadas estilo Ajustes */
.list { list-style: none; margin: 0; padding: 0; background: var(--ds-surface); border-radius: var(--ds-r-card); overflow: hidden; box-shadow: var(--ds-shadow-1); }
.list > li { position: relative; }
.list > li + li::before { content: ""; position: absolute; top: 0; right: 0; left: 62px; z-index: 1; border-top: 0.5px solid var(--ds-line-2); pointer-events: none; }
.row {
  width: 100%; min-height: 64px; display: flex; align-items: center; gap: 12px; padding: 10px 12px 10px 14px;
  border: 0; background: transparent; text-align: left; color: var(--ds-ink); transition: background-color 0.15s ease;
}
button.row:active { background: var(--ds-fill); }
.r-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.r-txt b { font-size: 17px; font-weight: 600; letter-spacing: -0.015em; }
.r-txt small { font-size: 14px; line-height: 1.3; color: var(--ds-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.r-bar { margin-top: 6px; height: 4px; border-radius: 99px; background: var(--ds-fill-2); overflow: hidden; }
.r-bar span { display: block; width: 0; height: 100%; border-radius: inherit; background: var(--chart); }
.r-end { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; text-align: right; }
.r-big { font-family: var(--ds-font-round); font-size: 24px; font-weight: 700; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }

}

<script>
'use strict';
(function () {

/*MOTOR:START*/
// ── Motor de detección ──────────────────────────────────────────────────────────
// Trabaja por cuadros de 50 ms. Para cada cuadro mide el nivel en la banda grave (80–800 Hz) y el nivel total.
// Un sonido es candidato a ronquido si en la banda grave sobresale del ruido de fondo, dura entre 0,25 y 3,5 s y
// la mayor parte de la energía que trae (descontado el fondo) es grave. Tres candidatos seguidos con el ritmo de la respiración (cada 1,5 a 12 s,
// regulares) confirman un episodio; mientras siga, cada nuevo candidato cuenta. El episodio termina tras 25 s sin
// ronquidos. Además guarda los últimos 25 s de audio a 8 kHz para que las grabaciones empiecen antes del ronquido.
var SENS = {
  baja:  { thr: 12, ratio: 0.66 },
  media: { thr: 9,  ratio: 0.60 },
  alta:  { thr: 6,  ratio: 0.52 }
};
var ABS_MIN = -85;

function Biquad(type, f, sr) {
  var w = 2 * Math.PI * f / sr, c = Math.cos(w), s = Math.sin(w), a = s / (2 * Math.SQRT1_2);
  var b0, b1, b2;
  if (type === 'lp') { b0 = (1 - c) / 2; b1 = 1 - c; b2 = (1 - c) / 2; }
  else { b0 = (1 + c) / 2; b1 = -(1 + c); b2 = (1 + c) / 2; }
  var a0 = 1 + a;
  this.b0 = b0 / a0; this.b1 = b1 / a0; this.b2 = b2 / a0; this.a1 = (-2 * c) / a0; this.a2 = (1 - a) / a0;
  this.x1 = 0; this.x2 = 0; this.y1 = 0; this.y2 = 0;
}
Biquad.prototype.run = function (x) {
  var y = this.b0 * x + this.b1 * this.x1 + this.b2 * this.x2 - this.a1 * this.y1 - this.a2 * this.y2;
  this.x2 = this.x1; this.x1 = x; this.y2 = this.y1; this.y1 = y;
  return y;
};

function Detector(sr, opt) {
  this.sr = sr;
  this.k = Math.max(1, Math.round(sr / 8000));
  this.rate = sr / this.k;                       // frecuencia de las grabaciones (8000 o 7350)
  this.frameN = Math.round(sr * 0.05);
  this.frameMs = this.frameN / sr * 1000;
  this.frameS = this.frameN / this.k;            // muestras guardadas por cuadro
  this.hp = [new Biquad('hp', 80, sr), new Biquad('hp', 80, sr)];
  this.lp = [new Biquad('lp', 800, sr), new Biquad('lp', 800, sr)];
  this.aa = [new Biquad('lp', this.rate * 0.42, sr), new Biquad('lp', this.rate * 0.42, sr)];
  this.ringN = Math.round(this.rate * 25);
  this.ring = new Float32Array(this.ringN);
  this.s = 0; this.dc = 0;
  this.acc = 0; this.e = 0; this.le = 0;
  this.floor = null; this.calib = [];
  this.ev = null; this.above = 0; this.below = 0;
  this.cands = []; this.ep = null; this.rec = null;
  this.armed = true;
  this.clock = null;
  this.level = -100; this.ratio = 0;
  this.on = (opt && opt.on) || function () {};
  this.setSens(opt && opt.sens);
}
Detector.prototype.setSens = function (name) {
  var p = SENS[name] || SENS.media;
  this.thr = p.thr; this.minRatio = p.ratio;
};
// x: bloque de muestras a la frecuencia del micrófono; now: hora (ms) del final del bloque
Detector.prototype.push = function (x, now) {
  var t0 = now - x.length / this.sr * 1000;
  if (this.clock === null || Math.abs(t0 - this.clock) > 2000) this.clock = t0;
  var aa0 = this.aa[0], aa1 = this.aa[1], hp0 = this.hp[0], hp1 = this.hp[1], lp0 = this.lp[0], lp1 = this.lp[1];
  for (var i = 0; i < x.length; i++) {
    var v = x[i];
    var a = aa1.run(aa0.run(v));
    if (++this.dc >= this.k) {
      this.dc = 0;
      this.ring[this.s % this.ringN] = a;
      this.s++;
      var r = this.rec;
      if (r && r.n < r.buf.length) r.buf[r.n++] = a;
    }
    var h = hp1.run(hp0.run(v));
    var l = lp1.run(lp0.run(h));
    this.e += h * h; this.le += l * l;
    if (++this.acc >= this.frameN) {
      this.clock += this.frameMs;
      this.frame(this.e / this.frameN, this.le / this.frameN, this.clock);
      this.acc = 0; this.e = 0; this.le = 0;
    }
  }
};
Detector.prototype.frame = function (e, le, t) {
  // Lt: nivel total; Ll: nivel en la banda grave (80–800 Hz), donde está el ronquido.
  // La detección usa la banda grave: el soplido de la respiración, un ventilador o la lluvia casi no la mueven.
  var Lt = 10 * Math.log10(e + 1e-12), Ll = 10 * Math.log10(le + 1e-12);
  this.level = Ll; this.ratio = le / (e + 1e-12);
  if (this.floor === null) {
    this.calib.push([Ll, Lt]);
    if (this.calib.length >= 30) {
      var q = Math.floor(this.calib.length * 0.3);
      this.floor = this.calib.map(function (c) { return c[0]; }).sort(function (a, b) { return a - b; })[q];
      this.floorT = this.calib.map(function (c) { return c[1]; }).sort(function (a, b) { return a - b; })[q];
    }
    this.on('frame', { t: t, L: Ll, r: this.ratio, floor: null });
    return;
  }
  var F = this.floor, on = F + this.thr, ev = this.ev;
  // parte de la energía que está por sobre el fondo, y qué fracción de ella es grave
  var xe = Math.max(0, e - Math.pow(10, this.floorT / 10)), xl = Math.max(0, le - Math.pow(10, F / 10));
  if (!ev) {
    if (Ll > on && Ll > ABS_MIN) {
      if (++this.above >= 2) {
        this.ev = { t0: t - 2 * this.frameMs, s0: this.s - 2 * this.frameS, xe: xe, xl: xl, pk: Ll, f: F };
        this.below = 0;
      }
    } else {
      this.above = 0;
      // ruido de fondo: baja rápido y sube despacio (unos 15 s)
      if (Ll < on - 2) this.floor += (Ll < F ? 0.06 : 0.004) * (Ll - F);
    }
    this.floorT += (Lt < this.floorT ? 0.06 : 0.02) * (Lt - this.floorT);
  } else {
    ev.xe += xe; ev.xl += Math.min(xl, xe || xl);
    if (Ll > ev.pk) ev.pk = Ll;
    if (Ll < on - 3) {
      if (++this.below >= 6) this.endEvent(t - 6 * this.frameMs, this.s - 6 * this.frameS);
    } else this.below = 0;
    if (this.ev && t - ev.t0 > 8000) {
      // un sonido grave y parejo de más de 8 s (motor, televisor) pasa a ser el nuevo fondo
      this.on('sound', { t0: ev.t0, t1: t, dur: t - ev.t0, ratio: ev.xl / (ev.xe + 1e-12), over: ev.pk - ev.f, snore: false, long: true });
      this.floor = Ll - 2; this.floorT = Lt - 2; this.ev = null; this.above = 0; this.below = 0; this.cands = [];
    }
  }
  if (this.ep && t - this.ep.last > 25000) this.endEpisode();
  this.on('frame', { t: t, L: Ll, r: this.ratio, floor: this.floor });
};
Detector.prototype.endEvent = function (t1, s1) {

    rec.snores++;
    if (R.clip) R.clip.n++;
    else if (cfg.audio && det.ep && !det.rec && rec.clips.length < MAX_CLIPS && d.t0 - R.lastClipT >= MID_CLIP_GAP) startClip(d.s0, d.t0, 1);
  } else if (type === 'episodeEnd') {
    rec.longest = Math.max(rec.longest, d.last - d.t0);
    if (R.clip) finishClip(d.lastS + 2 * det.rate);
  }
}
function startClip(s0, t0, n) {
  var det = Run.det, from = s0 - PRE_S * det.rate;
  var c = det.startClip(from, CLIP_MAX_S);
  Run.clip = { t: t0 - (s0 - c.s0) / det.rate * 1000, n: n };
  Run.lastClipT = Run.clip.t;
}
function finishClip(sEnd) {
  var R = Run, det = R.det, c = R.clip;
  R.clip = null;
  var out = det.stopClip(sEnd);
  if (!c || !out || out.data.length < det.rate * 2) return;
  var id = uid('c'), rate = Math.round(det.rate);
  var buf = encodeWav(out.data, rate);
  var meta = { id: id, t: Math.round(c.t), dur: Math.round(out.data.length / det.rate), n: c.n };
  var rec = R.rec;
  DB.put('audio', { id: id, night: rec.id, buf: buf }).then(function () {
    rec.clips.push(meta);
    rec.clips.sort(function (a, b) { return a.t - b.t; });
    if (Run && Run.rec === rec) saveRun();
    else DB.put('nights', rec).catch(function () {});
  }).catch(function () {});
}
function saveRun() {
  if (!Run || !Run.rec) return Promise.resolve();
  var now = Date.now();
  if (now < Run.listenFrom) return Promise.resolve();
  Run.rec.upd = now; Run.rec.end = now;
  return DB.put('nights', Run.rec).catch(function () {});
}

function tick() {
  var R = Run;
  if (!R || !R.det) return;
  var now = Date.now(), rec = R.rec, det = R.det;
  $('#n-clock').textContent = hm(now);
  if (!det.armed && now >= R.listenFrom) det.armed = true;
  // avisos: sin sonido del micrófono o pantalla sin bloqueo
  var warn = '';
  var silent = now - R.lastBlock > 8000;
  if (silent) {
    warn = 'No está llegando sonido del micrófono.';
    if (R.ctx.state !== 'running') R.ctx.resume().catch(function () {});
    if (!micTrackLive(R.mic) && !R.reopening) {
      R.reopening = true;
      micReopen(R.mic).then(function () { R.reopening = false; }, function () { R.reopening = false; });
    }
  }
  setWarn(warn, silent);
  // estado y cifras
  if (now < R.listenFrom) {
    nightStatus('Empieza a escuchar a las ' + hm(R.listenFrom), 'wait');
    $('#n-line').textContent = 'Puedes dejar el iPhone y dormir';
  } else {
    nightStatus((R.clip ? 'Grabando' : 'Escuchando') + ' · ' + fmtDur(now - R.listenFrom), R.clip ? 'rec' : '');
    var mins = Object.keys(rec.min).length;
    $('#n-line').textContent = rec.snores
      ? fmtInt(rec.snores) + ' ' + plural(rec.snores, 'ronquido', 'ronquidos') + ' · ' + mins + ' min roncando'
      : (det.floor === null ? 'Midiendo el silencio…' : 'Sin ronquidos por ahora');
  }
  if (R.stopAt && now >= R.stopAt) { finishNight('auto'); return; }
  // se atenúa sola y se mueve un poco cada minuto para cuidar la pantalla
  $('#night').classList.toggle('dim', now - R.lastTouch > 20000);
  if (Math.floor(now / MIN) !== R.drift) {
    R.drift = Math.floor(now / MIN);
    var k = R.drift % 8, dx = [0, 6, -6, 4, -4, 8, -8, 2][k], dy = [0, -8, 6, 10, -10, 4, -4, 8][k];
    $('#n-wrap').style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
  }
}
function nightStatus(text, kind) {
  $('#n-status').textContent = text;
  var dot = $('#n-dot');
  dot.className = 'n-dot' + (kind ? ' ' + kind : '');
}
function setWarn(text, canResume) {
  var w = $('#n-warn');
  w.hidden = !text; w.textContent = text;
  $('#n-resume').hidden = !canResume;
}

function finishNight(reason) {
  var R = Run;
  if (!R) return;
  Run = null;
  R.timers.forEach(clearInterval);
  var now = Date.now();
  if (R.det) {
    if (R.det.ep) R.rec.longest = Math.max(R.rec.longest, R.det.ep.last - R.det.ep.t0);
    if (R.clip) { Run = R; finishClip(R.det.ep ? R.det.ep.lastS + 2 * R.det.rate : null); Run = null; }
  }
  micClose(R.mic || { ctx: R.ctx });
  Awake.off();
  hideNight();
  var rec = R.rec;
  if (!rec) return;
  if (R.lastBlock && now - R.lastBlock > 5000) { Run = R; addGap(R.lastBlock, now); Run = null; }
  var heard = now - rec.start;
  if (now < R.listenFrom || (heard < 2 * MIN && !rec.snores)) {
    deleteNight(rec).then(render);
    toast('La noche fue muy corta y no se guardó.');
    return;
  }
  rec.end = now; rec.upd = now; rec.live = false;
  // espera a que terminen de guardarse las grabaciones pendientes
  setTimeout(function () {
    DB.put('nights', rec).then(prune).then(render).then(function () {
      var s = stats(rec);
      toast(reason === 'auto' ? 'Noche terminada a las ' + hm(now) + '.' : s.min ? 'Noche guardada: ' + s.min + ' min roncando.' : 'Noche guardada, sin ronquidos.');
    });
  }, 400);
}

function showNight() {
  var n = $('#night');
  n.hidden = false; n.classList.remove('dim');
  document.documentElement.classList.add('lock');
  setThemeColor('#000000');
  $('#n-clock').textContent = hm(Date.now());
  $('#n-line').innerHTML = '&nbsp;';
  $('#n-level').style.width = '0';
  setWarn('', false);
}
function hideNight() {
  $('#night').hidden = true;
  $('#n-wrap').style.transform = '';
  if (!sheetStack.length) document.documentElement.classList.remove('lock');
  setThemeColor(null);
}

// Al cerrar la app a mitad de la noche, la noche queda abierta: se cierra al volver a abrirla
function recover() {
  return DB.all('nights').then(function (all) {
    var jobs = [], cut = null;
    all.forEach(function (r) {
      if (!r.live) return;
      r.live = false; r.end = r.upd || r.start;
      if (r.end - r.start < 2 * MIN && !r.snores) jobs.push(deleteNight(r));
      else { r.cut = true; cut = r; jobs.push(DB.put('nights', r)); }
    });
    return Promise.all(jobs).then(function () {
      if (cut) toast('La app se cerró durante la noche; quedó guardada hasta las ' + hm(cut.end) + '.', 5000);
    });
  }).catch(function () {});
}

// Mantener presionado para terminar
(function () {
  var b = $('#n-hold'), t = 0;
  function down(e) { e.preventDefault(); b.classList.add('hold'); clearTimeout(t); t = setTimeout(function () { b.classList.remove('hold'); finishNight('manual'); }, 1300); }
  function up() { clearTimeout(t); b.classList.remove('hold'); }
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  b.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); if (!b.classList.contains('hold')) down(e); } });
  b.addEventListener('keyup', up);
})();
$('#night').addEventListener('pointerdown', function () {
  if (!Run) return;
  Run.lastTouch = Date.now();
  $('#night').classList.remove('dim');
});
$('#n-resume').addEventListener('click', function () {
  var R = Run;
  if (!R || !R.mic) return;
  Awake.on();
  R.ctx.resume().catch(function () {});
  if (!micTrackLive(R.mic)) micReopen(R.mic).catch(function (err) { micErrorSheet(err); });
});

document.addEventListener('visibilitychange', function () {
  if (document.hidden) {
    if (Run) saveRun();
    if (!Player.el.paused) Player.el.pause();
    return;
  }
  if (!Run || !Run.mic) return;
  Awake.on();
  Run.ctx.resume().catch(function () {});
  if (!micTrackLive(Run.mic)) micReopen(Run.mic).catch(function () {});
});
window.addEventListener('pagehide', function () { if (Run) saveRun(); });

// ── Probar la detección ─────────────────────────────────────────────────────────
function testSheet() {
  if (Run) return;
  if (!micSupported()) { infoSheet('Sin micrófono', '<p class="hint">Este navegador no permite usar el micrófono. Abre la app en Safari en el iPhone.</p>'); return; }
  Player.stop();
  var ctx;
  try { ctx = micBegin(); } catch (e) { micErrorSheet(e); return; }
  var T = { ctx: ctx, mic: null, det: null, sounds: [], confirmed: 0, tick: 0 };
  var sh = openSheet(
    '<div class="p-head"><div><h2>Probar la detección</h2><p class="sub">Ronca o imita un ronquido, a un metro del iPhone, unas cuantas veces seguidas.</p></div>' +
    '<button class="p-done" type="button" data-close>Listo</button></div>' +
    '<div class="card"><div class="meter"><div class="m-track"><span class="m-fill" id="t-fill"></span><i class="m-thr" id="t-thr"></i></div>' +
    '<div class="m-lab"><span id="t-state">Abriendo el micrófono…</span><span>Tono grave <b id="t-ratio">—</b></span></div></div></div>' +
    '<p class="note" id="t-conf">Cuando reconozca tres ronquidos con ritmo de respiración, aparecerá aquí.</p>' +
    '<p class="grp">Últimos sonidos</p><ul class="list" id="t-list"><li class="empty-row">Todavía nada.</li></ul>' +
    '<p class="hint">Sensibilidad: <b>' + cap(cfg.sens) + '</b>. La línea del medidor marca desde dónde un sonido cuenta. Si tus ronquidos no aparecen, sube la sensibilidad en Ajustes.</p>',
    function () { micClose(T.mic || { ctx: ctx }); T.closed = true; }
  );
  function onT(type, d) {
    if (T.closed) return;
    if (type === 'frame') {
      if (++T.tick % 2) return;
      var fill = $('#t-fill', sh.panel);
      if (d.floor === null) { $('#t-state', sh.panel).textContent = 'Midiendo el silencio…'; return; }
      var over = d.L - d.floor;
      fill.style.width = clamp(over / 30 * 100, 0, 100).toFixed(0) + '%';
      fill.classList.toggle('snore', over > T.det.thr && d.r >= T.det.minRatio);
      $('#t-thr', sh.panel).style.left = (T.det.thr / 30 * 100) + '%';
      $('#t-state', sh.panel).textContent = over > T.det.thr ? 'Sonido' : 'Silencio';
      $('#t-ratio', sh.panel).textContent = Math.round(d.r * 100) + ' %';
    } else if (type === 'sound') {
      T.sounds.unshift(d);
      T.sounds = T.sounds.slice(0, 6);
      $('#t-list', sh.panel).innerHTML = T.sounds.map(function (s) {
        var why = s.long ? 'Sonido largo (fondo)' : s.snore ? 'Parece ronquido' : s.dur < 250 ? 'Muy corto' : s.dur > 3500 ? 'Muy largo' : s.ratio < T.det.minRatio ? 'Poco grave' : 'Muy suave';
        return '<li class="kv"><span>' + (s.dur / 1000).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' s · grave ' + Math.round(s.ratio * 100) + ' %</span>' +
          '<span class="tag' + (s.snore ? ' yes' : '') + '">' + why + '</span></li>';
      }).join('');
    } else if (type === 'episode') {
      T.confirmed++;
      var c = $('#t-conf', sh.panel);
      c.className = 'note pos';
      c.textContent = 'Ronquido reconocido' + (T.confirmed > 1 ? ' (' + T.confirmed + ' veces)' : '') + '. Así se contará durante la noche.';
    }
  }
  micOpen(ctx, function (x) { if (T.det && !T.closed) T.det.push(x, Date.now()); }).then(function (mic) {
    if (T.closed) { micClose(mic); return; }
    T.mic = mic;
    T.det = new Detector(ctx.sampleRate, { sens: cfg.sens, on: onT });
  }).catch(function (err) {
    T.closed = true;
    sh.close();
    micErrorSheet(err);
  });
}

// ── Ajustes ─────────────────────────────────────────────────────────────────────
function settingsSheet() {
  var sh = openSheet(
    '<div class="p-head"><div><h2>Ajustes</h2></div><button class="p-done" type="button" data-close>Listo</button></div>' +
    '<p class="grp">Detección</p>' +
    '<ul class="list"><li class="opt"><span>Sensibilidad</span><div class="seg wide" role="group" aria-label="Sensibilidad" data-seg="sens">' +
    '<button type="button" data-v="baja">Baja</button><button type="button" data-v="media">Media</button><button type="button" data-v="alta">Alta</button></div></li></ul>' +
    '<p class="hint">Alta reconoce ronquidos más suaves, pero puede confundir otros sonidos graves. Baja cuenta solo los más claros.</p>' +
    '<button class="btn tonal block" type="button" data-act="test">Probar la detección</button>' +
    '<p class="grp">Grabaciones</p>' +
    '<ul class="list"><li class="kv"><span>Grabar los ronquidos</span><label class="sw"><input type="checkbox" data-cfg="audio"' + (cfg.audio ? ' checked' : '') + ' aria-label="Grabar los ronquidos"><span></span></label></li>' +
    '<li class="opt"><span>Conservar los audios de</span><div class="seg wide" role="group" aria-label="Conservar audios" data-seg="keep">' +
    '<button type="button" data-v="7">7 noches</button><button type="button" data-v="14">14 noches</button><button type="button" data-v="30">30 noches</button></div></li></ul>' +
    '<p class="hint">Se guarda un trozo de hasta ' + CLIP_MAX_S + ' s de cada episodio (máximo ' + MAX_CLIPS + ' por noche). Las cifras y el gráfico de cada noche se guardan siempre.</p>' +
    '<p class="grp">La noche</p>' +
    '<ul class="list"><li class="opt"><span>Empezar a escuchar</span><div class="seg wide" role="group" aria-label="Empezar a escuchar" data-seg="delay">' +
    '<button type="button" data-v="0">De inmediato</button><button type="button" data-v="15">En 15 min</button><button type="button" data-v="30">En 30 min</button></div></li>' +
    '<li class="kv"><span>Terminar sola</span><label class="sw"><input type="checkbox" data-cfg="stopOn"' + (cfg.stopOn ? ' checked' : '') + ' aria-label="Terminar sola"><span></span></label></li>' +
    '<li class="kv" id="row-stop"' + (cfg.stopOn ? '' : ' hidden') + '><span>A las</span><input class="time" type="time" id="stop-at" value="' + cfg.stopAt + '"></li></ul>' +
    '<p class="grp">Datos</p>' +
    '<ul class="list"><li class="kv"><span>Noches guardadas</span><span>' + nights.length + '</span></li>' +
    '<li class="kv"><span>Grabaciones</span><span id="st-audio">…</span></li></ul>' +
    '<button class="btn danger block" type="button" id="wipe">' + ICON.trash + 'Borrar todo</button>' +
    '<p class="hint">Todo queda guardado solo en este iPhone.</p>'
  );
  setSeg($('[data-seg="sens"]', sh.panel), cfg.sens);
  setSeg($('[data-seg="keep"]', sh.panel), String(cfg.keep));
  setSeg($('[data-seg="delay"]', sh.panel), String(cfg.delay));
  var nClips = 0;
  nights.forEach(function (r) { nClips += (r.clips || []).length; });
  var stA = $('#st-audio', sh.panel);
  stA.textContent = String(nClips);
  if (navigator.storage && navigator.storage.estimate) {
    navigator.storage.estimate().then(function (e) { if (e && e.usage) stA.textContent = nClips + ' · ' + fmtMB(e.usage); }).catch(function () {});
  }
  sh.panel.addEventListener('change', function (e) {
    var k = e.target.getAttribute('data-cfg');
    if (k) {
      cfg[k] = e.target.checked; saveCfg();
      if (k === 'stopOn') $('#row-stop', sh.panel).hidden = !cfg.stopOn;
    }
    if (e.target.id === 'stop-at' && e.target.value) { cfg.stopAt = e.target.value; saveCfg(); }
  });
  sh.panel.addEventListener('click', function (e) {
    var b = e.target.closest('.seg button');
    if (!b) return;
    var seg = b.parentNode, key = seg.getAttribute('data-seg'), v = b.getAttribute('data-v');
    cfg[key] = key === 'sens' ? v : +v;
    saveCfg(); setSeg(seg, v);
    if (key === 'keep') prune().then(render);
  });
  var wipe = $('#wipe', sh.panel), armT = 0;
  wipe.addEventListener('click', function () {
    if (!wipe.classList.contains('armed')) {
      wipe.classList.add('armed'); wipe.lastChild.textContent = 'Toca otra vez para borrar todo';
      armT = setTimeout(function () { wipe.classList.remove('armed'); wipe.lastChild.textContent = 'Borrar todo'; }, 3500);
      return;
    }
    clearTimeout(armT);
    Player.stop();
    Promise.all([DB.clear('nights'), DB.clear('audio')]).then(function () { sh.close(); toast('Se borraron todas las noches.'); render(); });
  });
}

// ── Acciones ────────────────────────────────────────────────────────────────────
document.addEventListener('click', function (e) {
  var seg = e.target.closest('#app .seg button');
  if (seg) {
    var key = seg.parentNode.getAttribute('data-seg'), v = seg.getAttribute('data-v');
    if (key === 'hourMode') { cfg.hourMode = v; saveCfg(); renderHours(); }
    if (key === 'hist') { cfg.hist = +v; saveCfg(); renderHist(); }
    return;
  }
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.getAttribute('data-act'), id = b.getAttribute('data-id');
  if (act === 'start') startNight();
  else if (act === 'settings') settingsSheet();
  else if (act === 'test') { closeAllSheets(); testSheet(); }
  else if (act === 'night') nightSheet(id);
  else if (act === 'play') Player.toggle(id);
  else if (act === 'clip') clipSheet(id, b.getAttribute('data-night'));
  else if (act === 'all-nights') { showAll = true; renderHist(); }
});

// ── Inicio ──────────────────────────────────────────────────────────────────────
recover().then(prune).catch(function () {}).then(render);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
// ── Sin zoom con los dedos ──────────────────────────────────────────────────────
// Safari en iPhone ignora «user-scalable=no»: se cancelan los gestos de pellizco y el arrastre con dos dedos.
// El doble toque ya no hace zoom gracias a «touch-action» en el CSS.
['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
  document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function (e) {
  if (e.touches.length > 1 || (typeof e.scale === 'number' && e.scale !== 1)) e.preventDefault();
}, { passive: false });

// Para pruebas en el navegador de escritorio
window.__ronquidos = { DB: DB, render: render, Detector: Detector };

})();
</script>
